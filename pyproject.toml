[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "argus-scrolls"
version = "0.1.0"
description = "ARGUS: a local, evidence-first instrument for Herculaneum scroll CT"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "DarthCeltic" }, { name = "Daine (clexious)" }]
classifiers = [
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Intended Audience :: Science/Research",
]
# numpy is imported at module level by the metric and most gates, so it is the one mandatory dependency.
dependencies = ["numpy>=1.26"]

[project.optional-dependencies]
# The read-only observatory, the command service and the UI transport. The Docker image installs this extra.
service = ["fastapi>=0.110", "uvicorn>=0.29", "websockets>=12", "httpx>=0.27",
           "tifffile>=2024.1", "pillow>=10", "psutil>=5.9"]
# Reading LOCAL OME-Zarr volumes (Raw CT planes and 3D bricks). The Docker image installs this extra.
volume-local = ["numpy>=1.26", "zarr>=3.0,<4", "fsspec>=2024.6"]
# Reading OME-Zarr volumes over the network as well.
volume = ["numpy>=1.26", "zarr>=3.0,<4", "fsspec>=2024.6", "s3fs>=2024.6"]
# Detector code paths. Not needed for setup, doctor, demo, the UI or the public test kit.
surface-model = ["torch>=2.4", "nnunetv2>=2.6"]
# The standalone evidence gate (`evidence-gate check|measure`); `measure` reads real tifxyz meshes.
evidence-gate = ["tifffile>=2024.1"]
# Everything the public test kit needs. scikit-learn is here only because the canonical metric is
# checked against an independent implementation; scipy and zarr are used by the geometry and volume tests.
test = ["pytest>=8", "psutil>=5.9", "scikit-learn>=1.4", "scipy>=1.11", "zarr>=3.0,<4", "fsspec>=2024.6",
        "tifffile>=2024.1", "pillow>=10"]

[project.scripts]
argus = "argus.cli.main:main"
evidence-gate = "evidence_gate.cli:main"

[tool.setuptools]
# Two package roots: `argus` and `evidence_gate` live at the repository root, `argus_vesuvius`
# (volume, geometry and baseline helpers) lives under src/. `pip install -e .` and the Docker
# image both resolve `python -m argus` and the `argus` command from this layout.

[tool.setuptools.packages.find]
where = ["src", "."]
include = ["argus_vesuvius*", "argus*", "evidence_gate*"]
exclude = ["argus.tests*", "argus.ui*", "tests*", "scripts*", "evidence_gate_fixtures*"]
namespaces = true

[tool.setuptools.package-data]
"argus" = ["*.json"]
"argus.cli" = ["*.json"]
"argus.core" = ["*.json"]
"argus.service" = ["*.json"]

[tool.pytest.ini_options]
# argus/tests is the public test kit; tests/ holds the release tests and the evidence-gate tests.
testpaths = ["argus/tests", "tests"]
# Nothing here may reach the network by default. Opt in with `pytest -m network`.
addopts = "-q -m 'not network'"
markers = [
    "network: requires live upstream access; excluded from the correctness gate",
]
